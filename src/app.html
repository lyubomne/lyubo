<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/InterVariable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// The stored theme before the first paint, or the page flashes the default one.
			// Key: THEME_STORAGE_KEY in $lib/constants
			try {
				const theme = localStorage.getItem('lyubo-theme');

				if (theme) {
					document.documentElement.dataset.theme = theme;
				}
			} catch (_err) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
